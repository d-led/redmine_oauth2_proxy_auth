name: Tests

# Redmine itself is not needed: these checks cover the parts that can be
# exercised without loading Rails.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Syntax-check every plugin file
        run: |
          status=0
          while IFS= read -r file; do
            ruby -c "$file" > /dev/null || status=1
          done < <(git ls-files '*.rb')
          exit $status

      - name: Unique logins for auto-provisioned users
        run: ruby test/unit/unique_login_test.rb
