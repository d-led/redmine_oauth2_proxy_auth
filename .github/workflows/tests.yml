name: Tests

# Redmine itself is not needed: these checks cover the parts that can be
# exercised without loading Rails.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.3']
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Syntax-check every plugin file
        run: |
          status=0
          while IFS= read -r file; do
            ruby -c "$file" > /dev/null || status=1
          done < <(git ls-files '*.rb')
          exit $status

      - name: Unique logins for auto-provisioned users
        run: ruby test/unit/unique_login_test.rb
